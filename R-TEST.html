<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="交互式 R 语言入门学习器" />
  <title>R Lab · R 语言学习器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div><strong>R Lab</strong><span>交互式学习器</span></div>
      </div>

      <div class="progress-card">
        <div class="progress-head"><span>学习进度</span><strong id="progressText">20%</strong></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <small id="progressDetail">已完成 1 / 5 节</small>
      </div>

      <nav class="lesson-list" id="lessonList" aria-label="课程章节"></nav>

      <div class="sidebar-tip">
        <span class="tip-icon">⌘</span>
        <p><strong>快捷键</strong><br><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 运行代码</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="打开目录">☰</button>
        <div class="breadcrumb"><span>基础入门</span><b>/</b><strong id="crumbTitle">变量与赋值</strong></div>
        <div class="top-actions">
          <button class="streak"><span>🔥</span><strong>3</strong><small>连续学习</small></button>
          <button class="avatar" aria-label="用户头像">RL</button>
        </div>
      </header>

      <section class="lesson" id="lessonContent"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
